name: Release

on:
  push:
    tags: ["v*"]

jobs:
  # The pack URL baked into every launcher: https://srgaabriel.github.io/ph-mc/pack.toml
  pack:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}pack.toml
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      # One artifact per attempt: deploy-pages fails on a re-run if two share a name
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pack
          name: github-pages-${{ github.run_attempt }}
      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: actions/cache@v4
        with:
          path: build/cache
          key: downloads-${{ hashFiles('launcher/SHA256SUMS') }}
      - run: nix develop --command just package-windows package-linux
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: build/dist/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: actions/cache@v4
        with:
          path: build/cache
          key: downloads-${{ hashFiles('launcher/SHA256SUMS') }}
      - run: nix develop --command just package-macos
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: build/dist/*

  release:
    needs: [pack, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
