name: Release

on:
  push:
    tags: ["v*"]

# The pack itself is served from https://minecraft.phack.sh/pack/ and uploaded by hand (deploy-site.nu)
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: actions/cache@v4
        with:
          path: build/cache
          key: downloads-${{ hashFiles('launcher/SHA256SUMS') }}
      - run: nix develop --command just package-windows package-linux
      - uses: actions/upload-artifact@v4
        with:
          name: dist-linux
          path: build/dist/*

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: actions/cache@v4
        with:
          path: build/cache
          key: downloads-${{ hashFiles('launcher/SHA256SUMS') }}
      - run: nix develop --command just package-macos
      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: build/dist/*

  release:
    needs: [linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
